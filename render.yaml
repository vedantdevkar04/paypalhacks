services:
  - type: web
    name: hiclose
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn hiclose.api.app:create_default_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.6"
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_SMALL_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_IMAGE_MODELS
        value: gemini-3.1-flash-image,gemini-2.5-flash-image
      - key: TRYON_ENABLED
        value: "0"
      - key: SHOP_TIMEZONE
        value: America/New_York
      - key: SHOP_BRAND
        value: Indigo Lane
      - key: WORKER_COUNT
        value: "10"
      - key: CHAT_LIMIT_PER_MINUTE
        value: "20"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: CHANNEL3_API_KEY
        sync: false
